name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from apps/electron/package.json
        required: true
        type: string

concurrency:
  group: release-windows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-sign-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      S3_VERSIONS_BUCKET_ENDPOINT: ${{ secrets.S3_VERSIONS_BUCKET_ENDPOINT }}
      S3_VERSIONS_BUCKET_NAME: ${{ vars.S3_VERSIONS_BUCKET_NAME }}
      S3_VERSIONS_BUCKET_REGION: ${{ vars.S3_VERSIONS_BUCKET_REGION }}
      S3_VERSIONS_BUCKET_ACCESS_KEY_ID: ${{ secrets.S3_VERSIONS_BUCKET_ACCESS_KEY_ID }}
      S3_VERSIONS_BUCKET_SECRET_ACCESS_KEY: ${{ secrets.S3_VERSIONS_BUCKET_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify requested version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $packageVersion = (Get-Content apps/electron/package.json -Raw | ConvertFrom-Json).version
          if ($env:REQUESTED_VERSION -ne $packageVersion) {
            throw "Requested version '$env:REQUESTED_VERSION' does not match package version '$packageVersion'"
          }
          bun run check-version

      - name: Verify release secrets
        shell: pwsh
        run: |
          $required = @(
            'CSC_LINK',
            'CSC_KEY_PASSWORD',
            'S3_VERSIONS_BUCKET_ENDPOINT',
            'S3_VERSIONS_BUCKET_ACCESS_KEY_ID',
            'S3_VERSIONS_BUCKET_SECRET_ACCESS_KEY'
          )
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            throw "Missing release configuration: $($missing -join ', ')"
          }

      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run P0 quality gates
        run: bun run validate:ci

      - name: Build, sign, verify, and publish
        run: bun run build --platform=win32 --arch=x64 --upload --latest --script --skip-install

      - name: Verify public release endpoints
        shell: pwsh
        run: |
          foreach ($attempt in 1..5) {
            bun run release:check:online
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt 5) {
              Write-Host "Public release is not ready yet; retrying in 15 seconds"
              Start-Sleep -Seconds 15
            }
          }
          throw "Public release verification failed after 5 attempts"

      - name: Preserve signed release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rocket-Windows-${{ inputs.version }}
          path: |
            apps/electron/release/Rocket-x64.exe
            apps/electron/release/Rocket-x64.exe.blockmap
            apps/electron/release/latest.yml
          if-no-files-found: warn
          retention-days: 14
