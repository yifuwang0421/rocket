name: Build Windows Internal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from apps/electron/package.json
        required: true
        type: string

concurrency:
  group: release-windows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-internal-candidate:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify requested version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $packageVersion = (Get-Content apps/electron/package.json -Raw | ConvertFrom-Json).version
          if ($env:REQUESTED_VERSION -ne $packageVersion) {
            throw "Requested version '$env:REQUESTED_VERSION' does not match package version '$packageVersion'"
          }
          bun run check-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run P0 quality gates
        run: bun run validate:ci

      - name: Build internal Windows candidate
        run: bun run build --platform=win32 --arch=x64 --skip-install

      - name: Verify internal candidate
        run: bun run release:check:internal

      - name: Record installer SHA-256
        shell: pwsh
        run: |
          $artifact = 'apps/electron/release/Rocket-x64.exe'
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Rocket-x64.exe" | Set-Content -LiteralPath 'apps/electron/release/SHA256SUMS.txt' -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload internal Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Rocket-Windows-Internal-${{ inputs.version }}
          path: |
            apps/electron/release/Rocket-x64.exe
            apps/electron/release/Rocket-x64.exe.blockmap
            apps/electron/release/latest.yml
            apps/electron/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
